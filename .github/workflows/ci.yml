name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nosh
          POSTGRES_PASSWORD: nosh
          POSTGRES_DB: nosh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nosh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://nosh:nosh@localhost:5432/nosh_test
      TEST_DATABASE_URL: postgres://nosh:nosh@localhost:5432/nosh_test
      SESSION_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm --filter backend migrate up

      - run: pnpm test

      - run: pnpm build

  # Builds both production images on every PR without publishing them, and
  # checks the frontend's nginx config parses. A merge to main is effectively
  # a production deploy (Watchtower pulls :latest overnight), so a broken
  # Dockerfile or nginx.conf has to fail here, not on the homelab at 04:00.
  images:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          load: true
          tags: nosh-frontend:ci
          cache-from: type=gha

      - run: docker run --rm nosh-frontend:ci nginx -t

  # Builds and publishes images to GHCR after a successful merge to main.
  # Nothing on the homelab ever talks to GitHub — Watchtower (already
  # running there) polls these images on its own schedule and pulls new
  # ones. See docs/decisions.md's CD entry for why it's pull-based.
  publish:
    needs: lint-test-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # GHCR image names must be lowercase; the repo owner
      # (ThomasOkVS) isn't, so this is spelled out rather than derived
      # from github.repository_owner.
      IMAGE_OWNER: thomasokvs
    steps:
      - uses: actions/checkout@v4

      # `sha-<7 chars>`: a short, human-typeable tag to pin TAG to on the
      # homelab (and to roll back to), alongside the full-SHA tag.
      - run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/nosh-backend:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/nosh-backend:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_OWNER }}/nosh-backend:sha-${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          # VITE_API_URL is baked into the static bundle at build time (see
          # frontend/Dockerfile), from a repo variable (Settings → Secrets
          # and variables → Actions → Variables). Its target value is the
          # relative `/api` (proxied by the frontend's own nginx); an unset
          # or empty variable falls back to that too.
          # VITE_APP_VERSION reuses the same commit SHA this build is tagged
          # with, so the version shown in the UI always matches a real image
          # tag.
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || '/api' }}
            VITE_APP_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/nosh-frontend:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/nosh-frontend:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_OWNER }}/nosh-frontend:sha-${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
