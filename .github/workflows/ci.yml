name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nosh
          POSTGRES_PASSWORD: nosh
          POSTGRES_DB: nosh_test
          # Server tests fold Unicode case (İRIS, ΑΣ) and need a UTF-8 ctype.
          POSTGRES_INITDB_ARGS: "--locale=en_US.utf8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nosh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://nosh:nosh@localhost:5432/nosh_test
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # COMMIT_SHA must stay unset here: the app bakes it into the bundle.
      - run: pnpm test
      - run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e

      - name: Keep Playwright traces from failed runs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  image:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Builds a throwaway image and checks it (health, SPA, yt-dlp, boot).
      - run: bash e2e/docker.smoke.sh

  # Only job with packages: write; never runs for pull requests.
  publish:
    needs: [check, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/thomasokvs/nosh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        run: |
          docker build --build-arg COMMIT_SHA="$GITHUB_SHA"             -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:main" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:main"
