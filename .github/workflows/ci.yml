name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nosh
          POSTGRES_PASSWORD: nosh
          POSTGRES_DB: nosh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nosh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://nosh:nosh@localhost:5432/nosh_test
      TEST_DATABASE_URL: postgres://nosh:nosh@localhost:5432/nosh_test
      SESSION_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm --filter backend migrate up

      - run: pnpm test

      - run: pnpm build

  # Builds and publishes images to GHCR after a successful merge to main.
  # Nothing on the homelab ever talks to GitHub — Watchtower (already
  # running there) polls these images on its own schedule and pulls new
  # ones. See docs/decisions.md's CD entry for why it's pull-based.
  publish:
    needs: lint-test-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # GHCR image names must be lowercase; the repo owner
      # (ThomasOkVS) isn't, so this is spelled out rather than derived
      # from github.repository_owner.
      IMAGE_OWNER: thomasokvs
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/nosh-backend:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/nosh-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          # VITE_API_URL is baked into the static bundle at build time (see
          # frontend/Dockerfile) — set it as a repo variable
          # (Settings → Secrets and variables → Actions → Variables) once
          # the homelab's Tailscale address is known.
          # VITE_APP_VERSION reuses the same commit SHA this build is tagged
          # with, so the version shown in the UI always matches a real image
          # tag.
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_APP_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/nosh-frontend:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/nosh-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
