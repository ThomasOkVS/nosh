# Production Compose file for the homelab (see docs/deployment.md), managed
# via Dockge. Distinct from the root docker-compose.yml, which is local-dev
# only (Dockerfile.dev, bind-mounted source, hot reload). This one runs the
# published images from GHCR (see .github/workflows/ci.yml) — Watchtower
# pulls new versions of the `:latest` tag on its own schedule, so there's no
# `build:` here at all.
#
# First deploy: see docs/deployment.md's "First-deploy runbook" section.
#
# Reference file: the homelab keeps its own copy (/opt/nosh), which can differ
# in details such as the backend's host port. Changes here have to be applied
# there by hand — see docs/deployment.md's "Public HTTPS cutover".
#
# Topology: browser → Caddy (TLS, `proxy` network, 172.28.255.2) → frontend
# nginx :8080 → /api/* → backend :3001. The backend only ever sees the
# frontend container as its peer, which is why the frontend has a fixed IP
# on `edge` and that exact IP is the backend's TRUSTED_PROXIES.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Bind-mounted under /DATA (rather than a named Docker volume, which
      # would live under /var/lib/docker/volumes/ instead) so the homelab's
      # existing Kopia backup — which sweeps /DATA wholesale — actually
      # covers it. See docs/deployment.md's directory layout convention.
      - /DATA/nosh/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/thomasokvs/nosh-backend:${TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET}
      UPLOADS_DIR: /repo/backend/uploads
      # See .env.prod.example for each of these.
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      # SEED_DEMO_DATA intentionally not set — env.ts defaults it to false,
      # which is what a real deployment wants (see docs/decisions.md's
      # demo-data-seed entry).
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_TEXT_MODEL: ${GEMINI_TEXT_MODEL:-}
      GEMINI_VIDEO_MODEL: ${GEMINI_VIDEO_MODEL:-}
      GEMINI_MODELS: ${GEMINI_MODELS:-}
      PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - /DATA/nosh/uploads:/repo/backend/uploads
    networks:
      - default # postgres
      - edge # reached by the frontend's nginx
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:3001/auth/me').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    image: ghcr.io/thomasokvs/nosh-frontend:${TAG:-latest}
    restart: unless-stopped
    ports:
      # Container port is 8080 (not 80) because the image runs nginx as a
      # non-root user — see frontend/Dockerfile.
      - "8080:8080"
    networks:
      edge:
        # Must equal the backend's TRUSTED_PROXIES.
        ipv4_address: 10.101.0.10
      # Uncomment at cutover so Caddy can reach this container. Only the
      # frontend joins `proxy`; the backend never does.
      # proxy: {}
    depends_on:
      - backend

networks:
  # Just frontend ↔ backend. A fixed subnet so the frontend's address is
  # stable; 10.101.0.0/24 sits outside Docker's automatic pools. Change both
  # this and the address above if it collides with anything on the host.
  edge:
    ipam:
      config:
        - subnet: 10.101.0.0/24
  # proxy:
  #   external: true
