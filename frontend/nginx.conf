# Included inside nginx's http {} block (as conf.d/default.conf), which is
# why a `map` can sit up here, outside the server block.

# Which scheme to tell the backend the browser used. Caddy (the homelab's
# TLS-terminating reverse proxy, fixed at 172.28.255.2 on its `proxy`
# network) terminates HTTPS and says so in X-Forwarded-Proto — that header is
# believed from Caddy only. From anyone else (e.g. a browser hitting :8080
# over the tailnet) it's ignored in favour of the scheme this server actually
# saw, so a client can't claim HTTPS it didn't use.
map $realip_remote_addr $nosh_forwarded_proto {
    172.28.255.2  $http_x_forwarded_proto;
    default       $scheme;
}

server {
    # 8080, not 80: the image runs nginx as a non-root user, which can't bind
    # a privileged port. See frontend/Dockerfile.
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;

    # The real client IP, for the backend's rate limiting. Behind Caddy every
    # connection comes from Caddy's IP, so the client's address is taken from
    # the X-Forwarded-For Caddy sets — but only on connections from Caddy
    # itself, so nobody else can inject one. $remote_addr is that client IP
    # from here on.
    set_real_ip_from  172.28.255.2;
    real_ip_header    X-Forwarded-For;

    # Docker's embedded DNS. Used (together with the variable in proxy_pass
    # below) so the backend is looked up per request instead of once at
    # startup: nginx then starts even if the backend is down or renamed, and
    # follows the backend to its new IP when Watchtower recreates it.
    resolver  127.0.0.11 valid=10s ipv6=off;

    # The API, same-origin: /api/auth/me → http://nosh-backend:3001/auth/me.
    # `^~` stops the regex asset-caching location below from ever matching
    # an /api URL (e.g. one ending in .png).
    #
    # `nosh-backend`, not the Compose service name `backend`: this container
    # also sits on the homelab's shared `proxy` network, where another
    # stack's service could be called `backend` too — and Docker DNS would
    # then happily hand back *that* container, sending nosh's passwords and
    # cookies to it. The unique alias is set in docker-compose.prod.yml.
    location ^~ /api/ {
        set $nosh_backend http://nosh-backend:3001;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $nosh_backend;

        proxy_set_header Host               $host;
        # Replaced, not appended to: the backend trusts only this container
        # and reads a single, real client IP.
        proxy_set_header X-Forwarded-For    $remote_addr;
        proxy_set_header X-Forwarded-Proto  $nosh_forwarded_proto;

        # Recipe photos are up to 5 MB (nginx's default cap is 1 MB).
        client_max_body_size  6m;
        # No long-lived requests to accommodate: an import answers 202 at
        # once and runs as a background job the client polls, so nginx's
        # default buffering and 60s timeouts are fine.
    }

    # index.html references the current build's hashed asset filenames, so
    # it must always be revalidated — otherwise a browser that cached it
    # from before a deploy keeps requesting assets that no longer exist.
    # Same reasoning for the PWA service worker: it's the thing that decides
    # whether a new app version is even noticed.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Not in nginx's default mime.types, so it falls back to
    # application/octet-stream without this — some browsers use the
    # manifest's content-type as part of deciding whether a PWA is
    # installable.
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }

    # Vite fingerprints every other built asset's filename with a content
    # hash, so those can be cached aggressively and forever.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routing (react-router-dom): any path that isn't a real
    # file falls back to index.html so the SPA's own router can handle it.
    location / {
        try_files $uri /index.html;
    }
}
