server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;

    # index.html references the current build's hashed asset filenames, so
    # it must always be revalidated — otherwise a browser that cached it
    # from before a deploy keeps requesting assets that no longer exist.
    # Same reasoning for the PWA service worker: it's the thing that decides
    # whether a new app version is even noticed.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Not in nginx's default mime.types, so it falls back to
    # application/octet-stream without this — some browsers use the
    # manifest's content-type as part of deciding whether a PWA is
    # installable.
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }

    # Vite fingerprints every other built asset's filename with a content
    # hash, so those can be cached aggressively and forever.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routing (react-router-dom): any path that isn't a real
    # file falls back to index.html so the SPA's own router can handle it.
    location / {
        try_files $uri /index.html;
    }
}
